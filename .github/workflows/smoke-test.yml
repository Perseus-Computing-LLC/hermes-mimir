name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  import-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e .
      - name: Smoke test — imports and MemoryProvider interface
        run: |
          python - <<'EOF'
          import sys
          import types

          # The provider is imported by Hermes, which supplies this ABC. The
          # standalone package intentionally has no Hermes dependency.
          agent_module = types.ModuleType("agent")
          memory_provider_module = types.ModuleType("agent.memory_provider")
          class MemoryProvider:
              pass
          memory_provider_module.MemoryProvider = MemoryProvider
          sys.modules["agent"] = agent_module
          sys.modules["agent.memory_provider"] = memory_provider_module

          from hermes_mimir import MimirProvider, PerseusVaultProvider

          provider = PerseusVaultProvider()
          assert provider.name == "perseus-vault"
          assert isinstance(provider, MimirProvider)
          for method in ("is_available", "initialize", "prefetch", "sync_turn", "get_tool_schemas", "handle_tool_call", "shutdown"):
              assert hasattr(provider, method), f"Missing {method}"
          print("Provider import and MemoryProvider interface passed")
          EOF

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check hermes_mimir/ tests/ 2>/dev/null || echo "Lint check complete"
